<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>彩票智查 - 首页</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: #f5f6f7;
      color: #1d1e20;
      padding-bottom: 70px;
    }
    /* 顶部导航 */
    .navbar {
      background: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar h1 { font-size: 20px; font-weight: 600; }
    .navbar .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e3e4e6;
      overflow: hidden;
      cursor: pointer;
    }
    .navbar .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 16px;
      background: white;
      margin-bottom: 12px;
    }
    .stats-card {
      background: #f5f6f7;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .stats-card .value {
      font-size: 18px;
      font-weight: 700;
      color: #3370ff;
      margin-bottom: 4px;
    }
    .stats-card .value.negative { color: #f25340; }
    .stats-card .title {
      font-size: 12px;
      color: #646666;
    }

    /* 快捷操作 */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px 16px;
    }
    .action-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .action-card:active { transform: scale(0.98); }
    .action-card .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .action-card .label {
      font-size: 14px;
      font-weight: 500;
      color: #1d1e20;
    }

    /* 最近记录 */
    .records-section {
      padding: 0 16px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .section-header h2 { font-size: 18px; font-weight: 600; }
    .section-header .view-all {
      font-size: 14px;
      color: #3370ff;
      text-decoration: none;
    }
    .record-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      cursor: pointer;
    }
    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .period { font-weight: 600; font-size: 16px; }
    .date { font-size: 12px; color: #969799; }
    .numbers {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .ball {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .ball.red { background: linear-gradient(135deg, #ff6b6b, #ee5253); }
    .ball.blue { background: linear-gradient(135deg, #3370ff, #2b5eb3); }
    .result-info {
      text-align: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #e3e4e6;
    }
    .win-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 185, 0, 0.1);
      color: #00b968;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .lose-text { color: #969799; font-size: 13px; }

    /* 底部导航 */
    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      box-shadow: 0 -1px 4px rgba(0,0,0,0.06);
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #646666;
      font-size: 10px;
      gap: 2px;
    }
    .tab-item.active { color: #3370ff; }
    .tab-icon { font-size: 20px; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #969799;
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="navbar">
    <h1>🎱 彩票智查</h1>
    <div class="avatar" onclick="showToast('用户中心')">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='8' r='4' fill='%233370ff'/%3E%3Cpath d='M12 14c-5 0-9 2-9 5v2h18v-2c0-3-4-5-9-5z' fill='%233370ff'/%3E%3C/svg%3E" alt="avatar">
    </div>
  </div>

  <!-- 统计卡片 -->
  <div class="stats-grid">
    <div class="stats-card">
      <div class="value">¥1,240</div>
      <div class="title">年度花费</div>
    </div>
    <div class="stats-card">
      <div class="value">¥340</div>
      <div class="title">中奖金额</div>
    </div>
    <div class="stats-card">
      <div class="value negative">-72.6%</div>
      <div class="title">ROI</div>
    </div>
  </div>

  <!-- 快捷操作 -->
  <div class="actions-grid">
    <div class="action-card" onclick="navigateTo('camera')">
      <div class="icon">📸</div>
      <div class="label">拍照识别</div>
    </div>
    <div class="action-card" onclick="navigateTo('prediction')">
      <div class="icon">✨</div>
      <div class="label">智能预测</div>
    </div>
  </div>

  <!-- 最近记录 -->
  <div class="records-section">
    <div class="section-header">
      <h2>最近记录</h2>
      <a href="#" class="view-all" onclick="navigateTo('records')">查看全部</a>
    </div>

    <div class="record-card" onclick="navigateTo('record-detail')">
      <div class="record-header">
        <span class="period">第2024050期</span>
        <span class="date">05-10 14:30</span>
      </div>
      <div class="numbers">
        <span class="ball red">03</span>
        <span class="ball red">08</span>
        <span class="ball red">15</span>
        <span class="ball red">22</span>
        <span class="ball red">27</span>
        <span class="ball red">31</span>
        <span class="ball blue">14</span>
      </div>
      <div class="result-info">
        <span class="win-badge">✓ 四等奖 ¥200</span>
      </div>
    </div>

    <div class="record-card" onclick="navigateTo('record-detail')">
      <div class="record-header">
        <span class="period">第2024049期</span>
        <span class="date">05-09 09:15</span>
      </div>
      <div class="numbers">
        <span class="ball red">02</span>
        <span class="ball red">09</span>
        <span class="ball red">15</span>
        <span class="ball red">19</span>
        <span class="ball red">26</span>
        <span class="ball red">28</span>
        <span class="ball blue">05</span>
      </div>
      <div class="result-info">
        <span class="lose-text">未中奖</span>
      </div>
    </div>

    <div class="record-card" onclick="navigateTo('record-detail')">
      <div class="record-header">
        <span class="period">第2024048期</span>
        <span class="date">05-08 20:30</span>
      </div>
      <div class="numbers">
        <span class="ball red">05</span>
        <span class="ball red">12</span>
        <span class="ball red">18</span>
        <span class="ball red">21</span>
        <span class="ball red">25</span>
        <span class="ball red">30</span>
        <span class="ball blue">09</span>
      </div>
      <div class="result-info">
        <span class="win-badge">✓ 五等奖 ¥10</span>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar">
    <a href="#" class="tab-item active" onclick="navigateTo('home')">
      <span class="tab-icon">🏠</span>
      <span>首页</span>
    </a>
    <a href="#" class="tab-item" onclick="navigateTo('camera')">
      <span class="tab-icon">📸</span>
      <span>拍照</span>
    </a>
    <a href="#" class="tab-item" onclick="navigateTo('records')">
      <span class="tab-icon">📋</span>
      <span>记录</span>
    </a>
    <a href="#" class="tab-item" onclick="navigateTo('prediction')">
      <span class="tab-icon">🔮</span>
      <span>预测</span>
    </a>
    <a href="#" class="tab-item" onclick="navigateTo('stats')">
      <span class="tab-icon">📊</span>
      <span>统计</span>
    </a>
  </div>

  <script>
    function navigateTo(page) {
      alert(`导航到: ${page}\n\n在实际Vue应用中，这将使用 Vue Router 跳转到对应页面。`);
    }

    function showToast(msg) {
      alert(msg);
    }
  </script>
</body>
</html>
