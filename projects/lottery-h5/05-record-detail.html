<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>彩票智查 - 记录详情</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: #f5f6f7;
      color: #1d1e20;
      padding-bottom: 80px;
    }

    /* 顶部导航 */
    .navbar {
      background: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-btn {
      font-size: 24px;
      color: #1d1e20;
      background: none;
      border: none;
      padding: 0;
      margin-right: 12px;
      cursor: pointer;
    }
    .navbar h1 { font-size: 18px; font-weight: 600; }

    /* 内容区域 */
    .content { padding: 16px; }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .card-title {
      font-size: 14px;
      color: #646666;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title .icon { font-size: 18px; }

    .numbers-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .ball {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 13px;
      font-weight: 600;
    }
    .ball.red { background: linear-gradient(135deg, #ff6b6b, #ee5253); }
    .ball.blue { background: linear-gradient(135deg, #3370ff, #2b5eb3); }
    .ball.gray { background: #e3e4e6; color: #969799; }

    .date-info {
      text-align: center;
      font-size: 13px;
      color: #969799;
      margin-top: 8px;
    }

    /* 中奖结果卡片 */
    .prize-result {
      text-align: center;
      padding: 16px;
    }
    .prize-amount {
      font-size: 28px;
      font-weight: 700;
      color: #00b968;
      margin: 8px 0;
    }
    .prize-level {
      display: inline-block;
      background: rgba(0, 185, 0, 0.1);
      color: #00b968;
      padding: 6px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
    }

    /* 匹配详情 */
    .match-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .match-item {
      text-align: center;
      padding: 8px;
      background: #f5f6f7;
      border-radius: 8px;
    }
    .match-label {
      font-size: 12px;
      color: #646666;
      margin-bottom: 4px;
    }
    .match-value {
      font-size: 18px;
      font-weight: 600;
    }
    .match-value.matched { color: #00b968; }

    /* 操作按钮 */
    .actions {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .btn {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-edit {
      background: #f5f6f7;
      color: #3370ff;
      border: 1px solid #e3e4e6;
    }
    .btn-delete {
      background: #ff4d4f;
      color: white;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-win {
      background: rgba(0, 185, 0, 0.1);
      color: #00b968;
    }
    .status-lose {
      background: #f5f6f7;
      color: #969799;
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="navbar">
    <button class="back-btn" onclick="goBack()">←</button>
    <h1>第2024050期详情</h1>
  </div>

  <div class="content">
    <!-- 投注号码 -->
    <div class="card">
      <div class="card-title">
        <span class="icon">🎯</span>
        <span>投注号码</span>
      </div>
      <div class="numbers-row">
        <span class="ball red">03</span>
        <span class="ball red">08</span>
        <span class="ball red">15</span>
        <span class="ball red">22</span>
        <span class="ball red">27</span>
        <span class="ball red">31</span>
        <span class="ball blue">14</span>
      </div>
      <div class="date-info">投注时间: 2024-05-10 14:30</div>
    </div>

    <!-- 开奖结果 -->
    <div class="card">
      <div class="card-title">
        <span class="icon">🏆</span>
        <span>开奖结果</span>
        <span style="margin-left: auto; font-size: 13px; color: #969799;">2024-05-10 开奖</span>
      </div>
      <div class="numbers-row">
        <span class="ball red">03</span>
        <span class="ball red">08</span>
        <span class="ball red">15</span>
        <span class="ball red">22</span>
        <span class="ball red">27</span>
        <span class="ball red">31</span>
        <span class="ball blue">14</span>
      </div>
      <div class="prize-result">
        <div class="prize-amount">¥200</div>
        <span class="status-badge status-win">✓ 四等奖</span>
      </div>
    </div>

    <!-- 匹配详情 -->
    <div class="card">
      <div class="card-title">
        <span class="icon">📊</span>
        <span>匹配详情</span>
      </div>
      <div class="match-detail">
        <div class="match-item">
          <div class="match-label">红球匹配</div>
          <div class="match-value matched">6/6</div>
        </div>
        <div class="match-item">
          <div class="match-label">蓝球匹配</div>
          <div class="match-value matched">1/1</div>
        </div>
        <div class="match-item">
          <div class="match-label">投注金额</div>
          <div class="match-value">¥2</div>
        </div>
        <div class="match-item">
          <div class="match-label">收益率</div>
          <div class="match-value" style="color: #00b968;">+9900%</div>
        </div>
      </div>
    </div>

    <!-- 备注信息 -->
    <div class="card">
      <div class="card-title">
        <span class="icon">📝</span>
        <span>备注</span>
      </div>
      <p style="color: #646666; font-size: 14px; line-height: 1.6;">
        机选号码，没想到真的中奖了！🏉
      </p>
    </div>
  </div>

  <!-- 底部操作按钮 -->
  <div class="actions">
    <button class="btn btn-edit" onclick="editRecord()">编辑</button>
    <button class="btn btn-delete" onclick="deleteRecord()">删除</button>
  </div>

  <script>
    function goBack() {
      alert('返回记录列表');
      // history.back();
    }

    function editRecord() {
      alert('进入编辑模式\n\n打开编辑表单，允许修改号码和备注');
    }

    function deleteRecord() {
      if (confirm('确定删除这条记录吗？删除后无法恢复。')) {
        alert('记录已删除');
        goBack();
      }
    }
  </script>
</body>
</html>
